<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAIF OSINT · Phone Lookup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.85;
        }

        body {
            background: #000;
            color: #00ff55;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        body::before {
            content: "";
            position: fixed;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(transparent 0px,
                    transparent 2px,
                    rgba(0, 255, 0, .035) 3px);
            animation: scan 8s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes scan {
            0% {
                transform: translateY(-100%);
            }
            100% {
                transform: translateY(100%);
            }
        }

        body::after {
            content: "";
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.8) 100%);
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 92%;
            max-width: 540px;
            border: 2px solid #00ff55;
            padding: 22px 22px 18px;
            border-radius: 14px;
            box-shadow: 0 0 45px rgba(0, 255, 85, 0.2),
                0 0 90px rgba(0, 255, 85, 0.05),
                inset 0 0 45px rgba(0, 255, 85, 0.04);
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(6px);
            max-height: 98vh;
            overflow-y: auto;
        }

        .container::-webkit-scrollbar {
            width: 4px;
        }
        .container::-webkit-scrollbar-track {
            background: #000;
        }
        .container::-webkit-scrollbar-thumb {
            background: #00ff55;
            border-radius: 2px;
        }

        .glitch-wrapper {
            text-align: center;
            margin-bottom: 6px;
            position: relative;
        }

        .glitch {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #00ff55;
            text-shadow: 0 0 25px #00ff55, 0 0 60px #00ff5533, 0 0 100px #00ff5511;
            position: relative;
            display: inline-block;
            animation: glitch 3.2s infinite;
        }

        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.6;
        }

        .glitch::before {
            color: #ff00c8;
            z-index: -1;
            animation: glitch-offset 2.5s infinite linear alternate-reverse;
        }

        .glitch::after {
            color: #00ffff;
            z-index: -2;
            animation: glitch-offset 3s infinite linear alternate-reverse;
        }

        .glitch-sub {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #33ff77;
            text-shadow: 0 0 20px #33ff77, 0 0 50px #33ff7733;
            position: relative;
            display: inline-block;
            animation: glitch-sub 3.6s infinite;
            margin-top: 2px;
        }

        .glitch-sub::before,
        .glitch-sub::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.5;
        }

        .glitch-sub::before {
            color: #ff66aa;
            z-index: -1;
            animation: glitch-offset-sub 2.8s infinite linear alternate-reverse;
        }

        .glitch-sub::after {
            color: #66ffcc;
            z-index: -2;
            animation: glitch-offset-sub 3.4s infinite linear alternate-reverse;
        }

        @keyframes glitch-sub {
            0%,
            94%,
            100% {
                transform: skew(0deg);
            }
            95% {
                transform: skew(3deg);
            }
            96% {
                transform: skew(-2deg);
            }
            97% {
                transform: skew(2deg);
            }
            98% {
                transform: skew(-1deg);
            }
            99% {
                transform: skew(1deg);
            }
        }

        @keyframes glitch-offset-sub {
            0% {
                transform: translate(2px, -1px);
            }
            25% {
                transform: translate(-3px, 2px);
            }
            50% {
                transform: translate(3px, -1px);
            }
            75% {
                transform: translate(-2px, 2px);
            }
            100% {
                transform: translate(1px, -2px);
            }
        }

        @keyframes glitch {
            0%,
            94%,
            100% {
                transform: skew(0deg);
            }
            95% {
                transform: skew(5deg);
            }
            96% {
                transform: skew(-3deg);
            }
            97% {
                transform: skew(4deg);
            }
            98% {
                transform: skew(-2deg);
            }
            99% {
                transform: skew(3deg);
            }
        }

        @keyframes glitch-offset {
            0% {
                transform: translate(3px, -2px);
            }
            25% {
                transform: translate(-4px, 2px);
            }
            50% {
                transform: translate(5px, -1px);
            }
            75% {
                transform: translate(-3px, 3px);
            }
            100% {
                transform: translate(2px, -3px);
            }
        }

        @keyframes flicker {
            0%,
            100% {
                opacity: 1;
            }
            92% {
                opacity: 1;
            }
            93% {
                opacity: 0.2;
            }
            94% {
                opacity: 1;
            }
            95% {
                opacity: 0.4;
            }
            96% {
                opacity: 1;
            }
        }
        .glitch {
            animation: glitch 3.2s infinite, flicker 6s infinite;
        }
        .glitch-sub {
            animation: glitch-sub 3.6s infinite, flicker 7s infinite;
        }

        .lookup-glow {
            position: relative;
            margin-bottom: 6px;
        }

        .lookup-glow::after {
            content: "";
            position: absolute;
            bottom: -8px;
            left: 10%;
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00ff55, transparent);
            box-shadow: 0 0 25px #00ff55, 0 0 60px #00ff5533;
            animation: glowSweep 3.5s ease-in-out infinite;
        }

        @keyframes glowSweep {
            0%,
            100% {
                opacity: 0.3;
                transform: scaleX(0.7);
            }
            50% {
                opacity: 1;
                transform: scaleX(1);
            }
        }

        .inputBox {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
            margin-top: 6px;
        }

        .inputBox input {
            flex: 1;
            background: #000;
            border: 2px solid #00ff55;
            color: #00ff55;
            padding: 14px 16px;
            font-size: 20px;
            outline: none;
            border-radius: 8px;
            letter-spacing: 4px;
            font-weight: bold;
            text-align: center;
            caret-color: transparent;
            cursor: default;
            user-select: none;
            box-shadow: 0 0 15px rgba(0, 255, 85, 0.05);
            transition: box-shadow 0.3s, border-color 0.3s;
        }

        .inputBox input:focus {
            box-shadow: 0 0 35px rgba(0, 255, 85, 0.2), inset 0 0 20px rgba(0, 255, 85, 0.04);
            border-color: #33ff77;
        }

        .inputBox input::placeholder {
            color: #2a442a;
            letter-spacing: 2px;
            font-size: 16px;
            font-weight: normal;
        }

        .inputBox button {
            background: #000;
            border: 2px solid #00ff55;
            color: #00ff55;
            padding: 14px 24px;
            cursor: pointer;
            font-size: 17px;
            transition: .25s;
            border-radius: 8px;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            flex-shrink: 0;
            white-space: nowrap;
            box-shadow: 0 0 12px rgba(0, 255, 85, 0.05);
        }

        .inputBox button:hover {
            background: #00ff55;
            color: #000;
            box-shadow: 0 0 45px #00ff55, 0 0 90px #00ff5533;
            transform: scale(1.02);
        }

        .inputBox button:active {
            transform: scale(0.94);
        }

        .terminal {
            margin-top: 14px;
            border: 1.5px solid #00ff55;
            min-height: 170px;
            max-height: 300px;
            padding: 16px 18px;
            font-size: 13px;
            box-shadow: inset 0 0 30px rgba(0, 255, 85, 0.04), 0 0 20px rgba(0, 255, 85, 0.02);
            overflow: auto;
            background: rgba(0, 10, 0, 0.7);
            border-radius: 8px;
            line-height: 1.7;
            word-break: break-word;
            scroll-behavior: smooth;
        }

        .terminal::-webkit-scrollbar {
            width: 4px;
        }
        .terminal::-webkit-scrollbar-track {
            background: #001000;
        }
        .terminal::-webkit-scrollbar-thumb {
            background: #00ff55;
            border-radius: 2px;
        }

        .terminal .dim {
            color: #338833;
        }
        .terminal .highlight {
            color: #66ff99;
            text-shadow: 0 0 12px #00ff55;
        }
        .terminal .error {
            color: #ff3355;
            text-shadow: 0 0 18px #ff3355;
        }
        .terminal .success {
            color: #33ff99;
            text-shadow: 0 0 18px #33ff99;
        }
        .terminal .info {
            color: #66ddff;
            text-shadow: 0 0 12px #66ddff55;
        }
        .terminal .code {
            color: #ccff88;
        }
        .terminal .key-tag {
            color: #ffaa66;
        }
        .terminal .string {
            color: #88ddff;
        }
        .terminal .number {
            color: #ff9966;
        }
        .terminal .null {
            color: #666666;
        }
        .terminal .bracket-symbol {
            color: #66ff99;
        }
        .terminal .proxy-note {
            color: #44aa66;
            font-size: 11px;
            letter-spacing: 0.5px;
        }
        .terminal .proxy-attempt {
            color: #88aa88;
            font-size: 12px;
        }

        .copy-section {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid rgba(0, 255, 85, 0.15);
            text-align: center;
        }

        .copy-btn {
            background: #000;
            border: 2px solid #00ff55;
            color: #00ff55;
            padding: 10px 28px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 6px;
            transition: all 0.25s ease;
            box-shadow: 0 0 12px rgba(0, 255, 85, 0.05);
            font-family: 'Courier New', monospace;
        }

        .copy-btn:hover {
            background: #00ff55;
            color: #000;
            box-shadow: 0 0 40px #00ff55, 0 0 80px #00ff5533;
            transform: scale(1.03);
        }

        .copy-btn:active {
            transform: scale(0.92);
        }

        .copy-btn.copied {
            border-color: #33ff99;
            color: #33ff99;
            background: rgba(0, 255, 85, 0.08);
            box-shadow: 0 0 30px #33ff9944;
        }

        .copy-btn .check {
            display: none;
        }
        .copy-btn.copied .check {
            display: inline;
        }
        .copy-btn.copied .copy-label {
            display: none;
        }

        .copy-feedback {
            display: inline-block;
            margin-left: 10px;
            font-size: 12px;
            color: #33ff99;
            text-shadow: 0 0 15px #33ff99;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .copy-feedback.show {
            opacity: 1;
        }

        .numpad {
            margin-top: 18px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 360px;
            margin-left: auto;
            margin-right: auto;
        }

        .key {
            border: 1.5px solid #00ff55;
            padding: 17px 0;
            text-align: center;
            border-radius: 8px;
            background: #000;
            color: #00ff55;
            font-size: 24px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.12s ease;
            user-select: none;
            box-shadow: 0 0 8px rgba(0, 255, 85, 0.05);
            letter-spacing: 1px;
            font-family: 'Courier New', monospace;
        }

        .key:hover {
            background: #00ff55;
            color: #000;
            box-shadow: 0 0 40px #00ff55, 0 0 80px #00ff5533;
            transform: scale(1.05);
            border-color: #33ff77;
        }

        .key:active {
            transform: scale(0.90);
            background: #00cc44;
            border-color: #00cc44;
        }

        .key.key-zero {
            grid-column: 1 / 2;
        }

        .key.key-back {
            border-color: #ff6644;
            color: #ff6644;
            box-shadow: 0 0 8px rgba(255, 102, 68, 0.1);
            font-size: 20px;
        }

        .key.key-back:hover {
            background: #ff6644;
            color: #000;
            box-shadow: 0 0 45px #ff6644, 0 0 90px #ff664433;
            border-color: #ff6644;
        }

        .key.key-enter {
            border-color: #33ff77;
            color: #33ff77;
            box-shadow: 0 0 8px rgba(51, 255, 119, 0.1);
            font-size: 18px;
            background: rgba(0, 30, 0, 0.3);
        }

        .key.key-enter:hover {
            background: #33ff77;
            color: #000;
            box-shadow: 0 0 50px #33ff77, 0 0 100px #33ff7733;
            border-color: #33ff77;
        }

        .key.key-enter:active {
            background: #22cc66;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid rgba(0, 255, 85, 0.12);
            font-size: 11px;
            color: #338833;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .status-bar .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff55;
            animation: pulse-dot 1.2s infinite;
            margin-right: 8px;
            vertical-align: middle;
            box-shadow: 0 0 15px #00ff55;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                box-shadow: 0 0 15px #00ff55;
            }
            50% {
                opacity: 0.2;
                box-shadow: 0 0 3px #00ff55;
            }
        }

        .status-bar .right {
            color: #2a552a;
            font-size: 10px;
            letter-spacing: 2px;
        }

        .status-bar .right span {
            color: #33ff77;
            text-shadow: 0 0 12px #33ff7744;
        }

        .loader-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #00ff55;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-left: 6px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .badge-glow {
            display: inline-block;
            padding: 2px 16px;
            border: 1px solid #00ff55;
            border-radius: 20px;
            font-size: 10px;
            letter-spacing: 3px;
            color: #33ff77;
            text-shadow: 0 0 12px #33ff7744;
            box-shadow: 0 0 20px rgba(0, 255, 85, 0.05);
            margin-top: 4px;
            background: rgba(0, 255, 85, 0.03);
        }

        .retry-btn {
            background: #000;
            border: 2px solid #ffaa44;
            color: #ffaa44;
            padding: 8px 22px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            border-radius: 6px;
            transition: all 0.2s;
            margin-top: 8px;
            font-family: 'Courier New', monospace;
        }

        .retry-btn:hover {
            background: #ffaa44;
            color: #000;
            box-shadow: 0 0 30px #ffaa44;
        }

        .retry-btn:active {
            transform: scale(0.94);
        }

        @media (max-width: 500px) {
            .container {
                padding: 16px 14px 14px;
                max-width: 100%;
                margin: 8px;
                border-radius: 10px;
            }
            .glitch {
                font-size: 20px;
                letter-spacing: 3px;
            }
            .glitch-sub {
                font-size: 14px;
                letter-spacing: 4px;
            }
            .inputBox input {
                font-size: 18px;
                padding: 12px 10px;
                letter-spacing: 3px;
            }
            .inputBox button {
                font-size: 14px;
                padding: 12px 14px;
            }
            .terminal {
                font-size: 11px;
                min-height: 130px;
                max-height: 200px;
                padding: 12px 14px;
            }
            .numpad {
                gap: 7px;
                max-width: 300px;
            }
            .key {
                padding: 14px 0;
                font-size: 20px;
                border-radius: 6px;
            }
            .key.key-back,
            .key.key-enter {
                font-size: 15px;
            }
            .status-bar {
                font-size: 9px;
                flex-wrap: wrap;
                gap: 4px;
            }
            .copy-btn {
                font-size: 12px;
                padding: 8px 18px;
            }
            .retry-btn {
                font-size: 11px;
                padding: 6px 16px;
            }
        }

        @media (max-width: 380px) {
            .numpad {
                gap: 5px;
                max-width: 260px;
            }
            .key {
                padding: 12px 0;
                font-size: 17px;
            }
            .key.key-back,
            .key.key-enter {
                font-size: 13px;
            }
            .glitch {
                font-size: 17px;
                letter-spacing: 2px;
            }
            .glitch-sub {
                font-size: 12px;
                letter-spacing: 3px;
            }
            .inputBox input {
                font-size: 15px;
                padding: 10px 8px;
                letter-spacing: 2px;
            }
            .inputBox button {
                font-size: 12px;
                padding: 10px 10px;
            }
            .terminal {
                font-size: 10px;
                padding: 10px 10px;
                min-height: 100px;
                max-height: 160px;
            }
            .copy-btn {
                font-size: 10px;
                padding: 6px 14px;
            }
            .retry-btn {
                font-size: 10px;
                padding: 5px 12px;
            }
        }

        .numpad {
            scrollbar-width: none;
        }
        .numpad::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>

    <div class="container">

        <div class="glitch-wrapper">
            <div class="glitch" data-text="⧩ PHONE LOOKUP">⧩ PHONE LOOKUP</div>
            <div class="glitch-sub" data-text="⟨ SAIF OSINT V1 ⟩">⟨ SAIF OSINT V1 ⟩</div>
            <div style="text-align:center; margin-top:2px;">
                <span class="badge-glow">⚡ LIVE · ENCRYPTED ⚡</span>
            </div>
        </div>

        <div class="lookup-glow">
            <div class="inputBox">
                <input type="text" maxlength="20" id="number" placeholder="◈ ENTER 10 DIGITS" readonly>
                <button onclick="lookup()">⚡ ATTACK</button>
            </div>
        </div>

        <div class="terminal" id="terminal">
            <span class="dim">> system ready</span><br>
            <span class="dim">> enter 10-digit target &amp; press ATTACK</span>
        </div>

        <div class="numpad" id="numpad">
            <div class="key" data-key="7">7</div>
            <div class="key" data-key="8">8</div>
            <div class="key" data-key="9">9</div>
            <div class="key" data-key="4">4</div>
            <div class="key" data-key="5">5</div>
            <div class="key" data-key="6">6</div>
            <div class="key" data-key="1">1</div>
            <div class="key" data-key="2">2</div>
            <div class="key" data-key="3">3</div>
            <div class="key key-zero" data-key="0">0</div>
            <div class="key key-back" data-key="⌫">⌫</div>
            <div class="key key-enter" data-key="ENTER">⏎ ENTER</div>
        </div>

        <div class="status-bar">
            <span><span class="dot"></span> ONLINE · SECURE</span>
            <span class="right">🔒 <span>SAIF OSINT</span> · v1.0</span>
        </div>

    </div>

    <script>
        // ─── GLOBALS ──────────────────────────────────────────────────────────
        let _lastResponseData = null;
        let _lastNumber = '';

        // ─── GLOWING MATRIX RAIN ────────────────────────────────────────────
        (function matrixRain() {
            const canvas = document.getElementById('matrixCanvas');
            const ctx = canvas.getContext('2d');
            let width, height, columns, drops;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
                columns = Math.floor(width / 18);
                drops = new Array(columns).fill(1);
            }
            resize();
            window.addEventListener('resize', resize);

            const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz<>/[]{}=+-_*&^%$#@!';

            function draw() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.045)';
                ctx.fillRect(0, 0, width, height);

                for (let i = 0; i < drops.length; i++) {
                    const char = chars[Math.floor(Math.random() * chars.length)];
                    const x = i * 18;
                    const y = drops[i] * 18;
                    const brightness = Math.random() * 0.5 + 0.5;
                    const r = Math.floor(0 * brightness);
                    const g = Math.floor(200 * brightness + 55);
                    const b = Math.floor(80 * brightness);

                    ctx.shadowColor = `rgba(0, 255, 85, ${0.3 + Math.random() * 0.4})`;
                    ctx.shadowBlur = 18 + Math.random() * 25;
                    ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                    ctx.font = '16px monospace';
                    ctx.fillText(char, x, y);

                    if (Math.random() > 0.92) {
                        ctx.shadowBlur = 40 + Math.random() * 30;
                        ctx.fillStyle = `rgba(0, 255, 85, 0.25)`;
                        ctx.fillText(char, x, y);
                    }

                    ctx.shadowBlur = 0;

                    if (y > height || Math.random() > 0.985) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                }
                requestAnimationFrame(draw);
            }
            draw();
        })();

        // ─── COPY FUNCTION ──────────────────────────────────────────────────
        function copyResponse() {
            if (!_lastResponseData) return;
            const text = _lastResponseData;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => showCopyFeedback(true)).catch(() => fallbackCopy(text));
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            ta.style.top = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                showCopyFeedback(true);
            } catch (e) {
                showCopyFeedback(false);
            }
            document.body.removeChild(ta);
        }

        function showCopyFeedback(success) {
            const btn = document.getElementById('copyBtn');
            const fb = document.getElementById('copyFeedback');
            if (!btn || !fb) return;
            if (success) {
                btn.classList.add('copied');
                fb.textContent = '✓ Copied!';
                fb.classList.add('show');
                setTimeout(() => {
                    btn.classList.remove('copied');
                    fb.classList.remove('show');
                }, 2500);
            } else {
                fb.textContent = '✘ Failed to copy';
                fb.classList.add('show');
                setTimeout(() => {
                    fb.classList.remove('show');
                }, 2000);
            }
        }

        // ─── DOM REFS ─────────────────────────────────────────────────────────
        const input = document.getElementById('number');
        const terminal = document.getElementById('terminal');

        // ─── NUMPAD CLICKS ──────────────────────────────────────────────────
        document.querySelectorAll('.key').forEach(key => {
            key.addEventListener('click', function(e) {
                const val = this.dataset.key;
                if (val === 'ENTER') { lookup(); return; }
                if (val === '⌫') { input.value = input.value.slice(0, -1); input.focus(); return; }
                if (/^[0-9]$/.test(val)) {
                    if (input.value.length < 20) { input.value += val; }
                    input.focus();
                }
            });
        });

        // ─── KEYBOARD SHORTCUT ─────────────────────────────────────────────
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && document.activeElement === input) {
                e.preventDefault();
                lookup();
            }
        });

        // ─── CORE LOOKUP ────────────────────────────────────────────────────
        async function lookup() {
            const num = input.value.trim();
            const term = terminal;

            if (!/^\d{10}$/.test(num)) {
                term.innerHTML = `
                    <span class="error">✘ ERROR : invalid target</span><br>
                    <span class="dim">> must be exactly 10 digits (0-9)</span><br>
                    <span class="dim">> current input : <span class="highlight">${num || '(empty)'}</span></span>
                `;
                _lastResponseData = null;
                return;
            }

            _lastNumber = num;
            term.innerHTML = `
                <span class="info">⏳ INITIALIZING CONNECTION ...</span><br>
                <span class="dim">├─ handshake with server</span><br>
                <span class="dim">├─ decrypting channel</span><br>
                <span class="dim">└─ <span class="highlight">ACCESS GRANTED</span> <span class="loader-dot"></span></span><br><br>
                <span class="dim">> fetching records for <span class="highlight">${num}</span></span><br>
                <span class="proxy-attempt">> trying CORS proxies...</span>
            `;
            _lastResponseData = null;

            // ── Build API URL ──
            const base = 'https://movements-invoice-amanda-victoria.trycloudflare.com';
            const endpoint = `/search/number?number=${num}&key=mysecretkey123`;
            const targetUrl = base + endpoint;

            // ── PROXY LIST (ordered by reliability) ──
            const proxies = [
                { name: 'cors.lol', url: 'https://api.cors.lol/?url=' },
                { name: 'corsproxy.io', url: 'https://corsproxy.io/?url=' },
                { name: 'allorigins.win', url: 'https://api.allorigins.win/raw?url=' }
            ];

            let lastError = null;

            for (const proxy of proxies) {
                try {
                    // Update status
                    term.innerHTML = `
                        <span class="info">⏳ INITIALIZING CONNECTION ...</span><br>
                        <span class="dim">├─ handshake with server</span><br>
                        <span class="dim">├─ decrypting channel</span><br>
                        <span class="dim">└─ <span class="highlight">ACCESS GRANTED</span> <span class="loader-dot"></span></span><br><br>
                        <span class="dim">> fetching records for <span class="highlight">${num}</span></span><br>
                        <span class="proxy-attempt">> trying proxy: ${proxy.name} ...</span>
                    `;

                    const url = proxy.url + encodeURIComponent(targetUrl);
                    const response = await fetch(url, {
                        method: 'GET',
                        headers: { 'Accept': 'application/json' }
                    });

                    if (!response.ok) {
                        // 404 means the API itself is down
                        if (response.status === 404) {
                            throw new Error(`API returned 404 (Not Found) – the server may be down or the endpoint has changed.`);
                        }
                        throw new Error(`HTTP ${response.status} – ${response.statusText}`);
                    }

                    const data = await response.json();

                    if (data.status === 'success' && data.result && data.result.length > 0) {
                        renderRawResults(num, data.result);
                        return; // success
                    } else {
                        // No data
                        term.innerHTML = `
                            <span class="error">✘ NO DATA FOUND</span><br>
                            <span class="dim">> target <span class="highlight">${num}</span> — not in database</span>
                        `;
                        _lastResponseData = null;
                        return;
                    }
                } catch (err) {
                    lastError = err;
                    // Continue to next proxy
                }
            }

            // All proxies failed
            const errorMsg = lastError ? lastError.message : 'Unknown error';
            term.innerHTML = `
                <span class="error">✘ CONNECTION FAILED</span><br>
                <span class="dim">> ${errorMsg}</span><br><br>
                <span class="dim">> possible issues :</span><br>
                <span class="dim">  • API server unreachable (404 or timeout)</span><br>
                <span class="dim">  • network blocked (try using a VPN or mobile data)</span><br>
                <span class="dim">  • invalid API key or endpoint</span><br><br>
                <span class="proxy-note">> all proxies failed. Check your internet connection.</span><br>
                <button class="retry-btn" onclick="lookup()">⟳ RETRY</button>
            `;
            _lastResponseData = null;
        }

        // ─── RAW CODE-STYLE RENDER ──────────────────────────────────────────
        function renderRawResults(num, results) {
            const rawObj = {
                status: "success",
                target: num,
                count: results.length,
                result: results
            };
            const jsonString = JSON.stringify(rawObj, null, 2);
            _lastResponseData = jsonString;

            let html = `
                <span class="success">✔ CONNECTION ESTABLISHED</span><br>
                <span class="dim">> target : <span class="highlight">${num}</span></span><br>
                <span class="dim">> records : <span class="highlight">${results.length}</span></span><br><br>
                <span class="bracket-symbol">┌─────────────────────────────────────────</span><br>
            `;

            results.forEach((item, idx) => {
                const name = esc(item.name || 'null');
                const fname = esc(item.fname || 'null');
                const aadhar = esc(item.aadhar || 'null');
                const address = esc(item.address || 'null');
                const alt = esc(item.alt || 'null');
                const circle = esc(item.circle || 'null');
                const email = esc(item.email || 'null');

                html += `
                    <span class="bracket-symbol">│</span> <span class="key-tag">[${idx + 1}]</span> <span class="code">{</span><br>
                    <span class="bracket-symbol">│</span>   <span class="key-tag">"name"</span>    : <span class="string">"${name}"</span>,<br>
                    <span class="bracket-symbol">│</span>   <span class="key-tag">"fname"</span>   : <span class="string">"${fname}"</span>,<br>
                    <span class="bracket-symbol">│</span>   <span class="key-tag">"aadhar"</span>  : <span class="string">"${aadhar}"</span>,<br>
                    <span class="bracket-symbol">│</span>   <span class="key-tag">"address"</span> : <span class="string">"${address}"</span>,<br>
                    <span class="bracket-symbol">│</span>   <span class="key-tag">"alt"</span>     : <span class="string">"${alt}"</span>,<br>
                    <span class="bracket-symbol">│</span>   <span class="key-tag">"circle"</span>  : <span class="string">"${circle}"</span>,<br>
                    <span class="bracket-symbol">│</span>   <span class="key-tag">"email"</span>   : <span class="string">"${email}"</span><br>
                    <span class="bracket-symbol">│</span> <span class="code">}</span>${idx < results.length - 1 ? ',' : ''}<br>
                `;
            });

            html += `
                <span class="bracket-symbol">└─────────────────────────────────────────</span><br>
                <span class="dim">> <span class="highlight">${results.length}</span> record(s) loaded</span>
            `;

            // ─── COPY BUTTON ────────────────────────────────────────────────
            html += `
                <div class="copy-section">
                    <button id="copyBtn" class="copy-btn" onclick="copyResponse()">
                        <span class="copy-label">📋 COPY RESPONSE</span>
                        <span class="check">✓ COPIED</span>
                    </button>
                    <span id="copyFeedback" class="copy-feedback"></span>
                </div>
            `;

            terminal.innerHTML = html;
            terminal.scrollTop = terminal.scrollHeight;
        }

        // ─── ESCAPE HTML ────────────────────────────────────────────────────
        function esc(str) {
            if (!str || str === 'null') return 'null';
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        // ─── AUTO-FOCUS ──────────────────────────────────────────────────────
        window.addEventListener('load', () => {
            input.focus();
            terminal.innerHTML = `
                <span class="dim">> system ready</span><br>
                <span class="dim">> enter 10-digit target &amp; press ATTACK</span>
            `;
        });

        // ─── PREVENT MOBILE KEYBOARD ──────────────────────────────────────
        input.addEventListener('focus', function() {
            this.blur();
            setTimeout(() => this.focus(), 10);
        });

        input.addEventListener('contextmenu', e => e.preventDefault());
    </script>

</body>
</html>

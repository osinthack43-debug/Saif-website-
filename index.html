<head>

    /* RESET & BASE */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      min-height: 100vh;
      font-family: 'Share Tech Mono', monospace;
      color: #00ff00;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      position: relative;
      overflow: hidden;

    /* MATRIX RAIN */
    #matrix-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.15;
    }
    /* SCANLINES & GLITCH OVERLAYS */
    .scanline {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(0,255,0,0.015) 2px, rgba(0,255,0,0.015) 4px);
      opacity: 0.6;
    }
    .glitch-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(0,255,0,0.006) 0px, rgba(0,255,0,0.006) 1px, transparent 1px, transparent 3px);
      opacity: 0.4;
      animation: glitch-flicker 0.15s infinite alternate;
    }
    @keyframes glitch-flicker {
      0% { opacity: 0.3; }
      100% { opacity: 0.6; }
    }
    /* CRT SCREEN FLICKER */
    .crt-flicker {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
      background: rgba(0,255,0,0.02);
      animation: flicker 4s infinite;
    }
    @keyframes flicker {
      0% { opacity: 0; }
      10% { opacity: 0.05; }
      20% { opacity: 0; }
      80% { opacity: 0; }
      90% { opacity: 0.03; }
      100% { opacity: 0; }
    }
    /* TERMINAL */
    .terminal {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 960px;
      max-height: 96vh;
      overflow-y: auto;
      background: rgba(6,12,6,0.92);
      backdrop-filter: blur(12px);
      border: 2px solid rgba(0,255,0,0.08);
      border-radius: 18px;
      padding: 28px 30px 34px;
      box-shadow: 0 0 120px rgba(0,255,0,0.02), inset 0 0 150px rgba(0,255,0,0.01);
      scroll-behavior: smooth;
    }
    .terminal::-webkit-scrollbar { width: 4px; }
    .terminal::-webkit-scrollbar-track { background: rgba(0,255,0,0.01); }
    .terminal::-webkit-scrollbar-thumb { background: rgba(0,255,0,0.08); border-radius: 10px; }
    /* HEADER */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      border-bottom: 1px solid rgba(0,255,0,0.04);
      padding-bottom: 12px;
      margin-bottom: 14px;

    .header .brand {
      font-family: 'Orbitron', sans-serif;

      font-size: 22px;
      letter-spacing: 4px;

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: brand-glitch 2s infinite;
      text-shadow: 0 0 60px rgba(0,255,0,0.05);

    @keyframes brand-glitch {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }

    .header .status {

    .header .status .dot {

    /* SUBHEADER - ASCII ART STYLE */
    .subheader {

    /* INPUT LINE - HACKER STYLE */
    .input-line {
      display: flex;

      gap: 8px;
      background: rgba(0,255,0,0.015);
      border: 1px solid rgba(0,255,0,0.03);

    .input-line .prompt-symbol {
      color: rgba(0,255,0,0.08);

    .input-line input {

    .output-header .copy-btn:hover {

    }
    .output-header .copy-btn.copied {

    }
    /* TYPING CONTAINER - HACKER OUTPUT */
    .typing-container {
      font-family: 'Share Tech Mono', monospace;
      font-size: 15px;
      line-height: 2.0;
      color: #70ff70;
      white-space: pre-wrap;

      padding: 8px 4px;
      max-height: 420px;

    .typing-container .cursor {
      display: inline-block;

    .typing-container .label-key {

    /* HACKING & HACKED - GLITCH */
    .typing-container .hacking-text {
      color: #00ff00;
      font-weight: bold;
      text-align: center;
      font-size: 24px;

    .typing-container .hacked-text {

    @keyframes glitch-hack {
      0% { transform: translateX(-3px); opacity:0.9; }

    /* BOTTOM BAR - HACKER BADGES */

    /* RESPONSIVE */
    @media (max-width: 750px) {
      .terminal { padding: 16px 14px 20px; border-radius: 12px; max-height: 98vh; }

      .input-line input { font-size: 16px; padding: 12px 4px; width:100%; border:1px solid rgba(0,255,0,0.02); border-radius:8px; padding:12px 14px; background:rgba(0,255,0,0.005); }
      .input-line .prompt-symbol { display: none; }
      .input-line .btn-execute { width:100%; padding:12px; font-size:12px; margin-top:4px; }
      .typing-container { font-size:13px; line-height:1.9; max-height:300px; }

      .typing-container .welcome-text { font-size:20px; }

    }
    @media (max-width: 400px) {

      .typing-container { font-size: 12px; line-height: 1.8; }

    }
    ::-webkit-scrollbar { width: 3px; height: 3px; }
    ::-webkit-scrollbar-track { background: rgba(0,255,0,0.002); }
    ::-webkit-scrollbar-thumb { background: rgba(0,255,0,0.03); border-radius: 10px; }
  </style>

  <script>
    (function() {
      'use strict';

      // ---- DOM ----
      const input = document.getElementById('numberInput');
      const searchBtn = document.getElementById('searchBtn');
      const loader = document.getElementById('loader');
      const errorMsg = document.getElementById('errorMsg');
      const errorText = document.getElementById('errorText');
      const retryBtn = document.getElementById('retryBtn');
      const typingContainer = document.getElementById('typingContainer');
      const copyBtn = document.getElementById('copyBtn');
      const terminal = document.getElementById('terminal');

      // ---- state ----
      let lastData = null;
      let isTyping = false;
      let typingAbort = false;

      // ---- REAL API ----
      const API_BASE = 'https://movements-invoice-amanda-victoria.trycloudflare.com/search/number';
      const API_KEY = 'mysecretkey123';
      const CORS_PROXY = 'https://api.allorigins.win/raw?url=';

        return { status:"success", result: { num:number, name:"User Not Found", fname:"—", aadhar:"—", circle:"—", address:"No records found for this number", email:"—", alt:"—" } };
      }

      // ---- helpers ----
      function formatNumber(raw) {
        let d = raw.replace(/\D/g,'');
        if (d.startsWith('91') && d.length>10) d = d.slice(2);
        if (d.length>10) d = d.slice(-10);
        return d;
      }
      function isValidNumber(n) { return /^[0-9]{10}$/.test(n); }
      function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

      // ---- fetch with CORS fallback ----
      async function fetchWithCorsFallback(url) {
        try {
          const r = await fetch(url, { method:'GET', headers:{'Accept':'application/json'} });
          if (r.ok) return r;
        } catch(e) { console.log('Direct fetch failed, trying CORS proxy...'); }
        const proxyUrl = CORS_PROXY + encodeURIComponent(url);
        return await fetch(proxyUrl);
      }

      // ---- typewriter ----
      async function typeText(lines, container, totalDuration = 15000) {
        if (isTyping) return;
        isTyping = true;
        typingAbort = false;
        container.innerHTML = '';
        const full = lines.join('\n');
        const chars = full.split('');
        const total = chars.length;
        const delay = Math.max(6, totalDuration / total);
        let current = '';
        let idx = 0;
        const cursor = document.createElement('span');
        cursor.className = 'cursor';
        container.appendChild(cursor);
        while (idx < chars.length) {
          if (typingAbort) break;
          current += chars[idx];
          idx++;
          const node = document.createTextNode(current);
          container.innerHTML = '';
          container.appendChild(node);
          container.appendChild(cursor);
          container.scrollTop = container.scrollHeight;
          terminal.scrollTop = terminal.scrollHeight;
          let d = delay;
          if (chars[idx-1] === '\n') d = delay * 1.6;
          else if (chars[idx-1] === ' ' || chars[idx-1] === '\t') d = delay * 0.4;
          else if (chars[idx-1] === ',' || chars[idx-1] === '.' || chars[idx-1] === ':' || chars[idx-1] === ';') d = delay * 1.3;
          else if (chars[idx-1] === '─') d = delay * 0.3;
          await sleep(Math.min(d, 100));
        }
        container.innerHTML = renderStyled(lines);
        isTyping = false;
      }

      function renderStyled(lines) {
        let html = '';
        for (let line of lines) {
          const match = line.match(/^(.+?)\s*:\s*(.+)$/);
          if (match) {
            const label = match[1].trim();
            const value = match[2].trim();
            const isHighlight = label.toLowerCase() === 'number';
            const cls = isHighlight ? 'highlight' : '';
            html += `<span class="line"><span class="label-key">${label}</span><span class="separator"> : </span><span class="${cls}">${value}</span></span>`;
          } else {
            html += `<span class="line">${line}</span>`;
          }
        }
        return html;
      }

      function formatDataForDisplay(data) {
        const lines = [];
        let items = [];
        if (Array.isArray(data.result)) items = data.result;
        else if (data.result && typeof data.result === 'object') items = [data.result];
        else items = [];
        if (items.length === 0) {
          lines.push('⚠️  NO RECORDS FOUND');
          lines.push('└── target number not in database');
          return lines;
        }
        const total = items.length;
        lines.push(`📡  INTELLIGENCE REPORT  —  ${total} record(s) found`);
        lines.push('');
        items.forEach((item, idx) => {
          if (idx > 0) lines.push('───');
          lines.push(`  [${idx + 1}/${total}]`);
          lines.push(`  Number      : ${item.num || '—'}`);
          lines.push(`  Name        : ${item.name || '—'}`);
          lines.push(`  Father      : ${item.fname || '—'}`);
          lines.push(`  Aadhar      : ${item.aadhar || '—'}`);
          lines.push(`  Circle      : ${item.circle || '—'}`);
          lines.push(`  Address     : ${item.address || '—'}`);
          lines.push(`  Email       : ${item.email || '—'}`);
          lines.push(`  Alternate   : ${item.alt || '—'}`);
        });
        lines.push('');
        lines.push('✔  EXTRACTION COMPLETE  ·  SIGNAL TERMINATED');
        return lines;
      }

      async function showHackingProcess(container) {
        container.innerHTML = `<div class="hacking-text">▸ HACKING IN PROCESS... ▸</div>`;
        await sleep(2000);
      }

      async function showSystemHacked(container) {
        container.innerHTML = `<div class="hacked-text">⚠ SYSTEM HACKED ⚠</div>`;
        await sleep(1200);
      }

      // ---- main ----
      async function performLookup() {
        const raw = input.value.trim();
        const clean = formatNumber(raw);
        if (!isValidNumber(clean)) {
          input.style.borderColor = 'rgba(255,68,102,0.1)';
          errorText.textContent = '❌ Invalid · must be 10 digits (e.g. 9661756498)';
          errorMsg.classList.add('active');
          typingContainer.innerHTML = `<div class="welcome-text">═══ WELCOME TO SAIF OSINT ═══</div>`;
          return;
        }
        input.style.borderColor = '';
        errorMsg.classList.remove('active');

        const url = `${API_BASE}?number=${clean}&key=${API_KEY}`;
        loader.classList.add('active');
        searchBtn.disabled = true;
        typingAbort = true;
        await sleep(50);
        typingAbort = false;

        try {
          await showHackingProcess(typingContainer);

          // ---- Try real API ----
          let data = null;
          let apiSuccess = false;
          try {
            const response = await fetchWithCorsFallback(url);
            if (response.ok) {
              const json = await response.json();
              if (json.status === 'success') {
                data = json;
                apiSuccess = true;
              }
            }
          } catch (e) { console.log('API failed:', e); }

          // ---- Fallback to demo ----
          if (!apiSuccess) {
            console.log('⚠️ API failed, using backup demo');
            data = getBackupData(clean);
            errorText.textContent = '⚠️ API unreachable · showing cached data';
            errorMsg.classList.add('active');
            setTimeout(() => errorMsg.classList.remove('active'), 3000);
          }

          lastData = data;
          await showSystemHacked(typingContainer);
          const lines = formatDataForDisplay(data);
          await typeText(lines, typingContainer, 15000);

        } catch (err) {
          errorText.textContent = err.message || 'Network error';
          errorMsg.classList.add('active');
          typingContainer.innerHTML = `<div class="welcome-text">═══ WELCOME TO SAIF OSINT ═══</div>`;
        } finally {
          loader.classList.remove('active');
          searchBtn.disabled = false;
        }
      }

      // ---- copy ----
      function copyData() {
        if (!lastData) {
          copyBtn.textContent = '⛔ NO DATA';
          setTimeout(() => copyBtn.textContent = '⎘ COPY', 1400);
          return;
        }
        const json = JSON.stringify(lastData, null, 2);
        navigator.clipboard.writeText(json).then(() => {
          copyBtn.textContent = '✓ COPIED!';
          copyBtn.classList.add('copied');
          setTimeout(() => {
            copyBtn.textContent = '⎘ COPY';
            copyBtn.classList.remove('copied');
          }, 2400);
        }).catch(() => {
          const ta = document.createElement('textarea');
          ta.value = json;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
          copyBtn.textContent = '✓ COPIED!';
          setTimeout(() => copyBtn.textContent = '⎘ COPY', 2000);
        });
      }

      // ---- matrix rain ----
      function initMatrix() {
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        let w, h;
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@%&*()';
        let columns, drops;
        let fontSize = 14;
        function resize() {
          w = canvas.width = window.innerWidth;
          h = canvas.height = window.innerHeight;
          fontSize = Math.max(10, Math.min(16, w / 88));
          columns = Math.floor(w / fontSize);
          drops = [];
          for (let i = 0; i < columns; i++) drops.push(Math.floor(Math.random() * -120));
        }
        function draw() {
          ctx.fillStyle = 'rgba(10,10,10,0.04)';
          ctx.fillRect(0, 0, w, h);
          ctx.font = `${fontSize}px 'Share Tech Mono', monospace`;
          ctx.textAlign = 'center';
          for (let i = 0; i < drops.length; i++) {
            const ch = chars[Math.floor(Math.random() * chars.length)];
            const x = i * fontSize + fontSize / 2;
            const y = drops[i] * fontSize;
            const brightness = 0.10 + 0.90 * (1 - Math.abs(y / h));
            ctx.fillStyle = `rgba(0, 255, 0, ${brightness * 0.12})`;
            ctx.fillText(ch, x, y);
            drops[i] += 0.3 + Math.random() * 0.5;
            if (drops[i] * fontSize > h + 50) drops[i] = Math.floor(Math.random() * -40);
          }
          requestAnimationFrame(draw);
        }
        window.addEventListener('resize', resize);
        resize();
        draw();
      }

      // ---- events ----
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); performLookup(); }
        if (e.key === 'Escape') {
          input.blur();
          input.style.borderColor = '';
          errorMsg.classList.remove('active');
          typingContainer.innerHTML = `<div class="welcome-text">═══ WELCOME TO SAIF OSINT ═══</div>`;
        }
      });
      input.addEventListener('focus', () => {
        input.style.borderColor = '';
        errorMsg.classList.remove('active');
      });
      searchBtn.addEventListener('click', performLookup);
      retryBtn.addEventListener('click', performLookup);
      copyBtn.addEventListener('click', copyData);

      window.addEventListener('DOMContentLoaded', () => {
        initMatrix();
        typingContainer.innerHTML = `<div class="welcome-text">═══ WELCOME TO SAIF OSINT ═══</div>`;
      });

    })();
  </script>
